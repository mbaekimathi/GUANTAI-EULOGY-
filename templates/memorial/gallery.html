{% extends "base.html" %}



{% block content %}
<div class="page-content">
<header class="page-hero">

  <h2 class="page-hero__title">Gallery</h2>

  <p class="page-hero__lead">Photographs and moments from a life well lived.</p>

</header>



{% if photos %}

<div class="gallery-grid">

  {% for photo in photos %}

  <figure class="gallery-item">

    <img src="{{ photo.image.url }}" alt="{{ photo.caption|default:'Memorial photograph' }}" loading="lazy">

    {% if photo.caption %}

    <figcaption class="gallery-item__caption">{{ photo.caption }}</figcaption>

    {% endif %}

  </figure>

  {% endfor %}

</div>

{% else %}

<article class="card">

  <p class="card__body">Photos will appear here once they are added from the admin dashboard.</p>

</article>

{% endif %}
</div>
{% endblock %}
